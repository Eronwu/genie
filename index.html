<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Genie AI — 手绘速写本</title>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<script src="https://unpkg.com/roughjs@latest/bundled/rough.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#2C2826;
  --dot:#3D3835;
  --text-dark:#2B2826;
  --text-mid:#7B7875;
  --amber:#E8850C;
  --amber-glow:rgba(232,133,12,0.2);
  --purple:#3D2C5E;
  --purple-glow:rgba(61,44,94,0.25);
  --coral:#FF6B6B;
  --paper-white:#FBF7F0;
  --sticky-yellow:#F0E8D8;
  --sticky-pink:#F5E8E8;
  --sticky-blue:#E8EEF5;
  --sticky-purple:#EDE8F5;
  --green:#58CC02;
  --red:#E84855;
}
html{font-size:16px}
body{
  background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(255,255,255,0.04) 1px,transparent 1px);
  background-size:22px 22px;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC',sans-serif;
  color:var(--text-dark);
  padding:24px 16px 48px;
  display:flex;
  justify-content:center
}
#app{
  max-width:620px;
  width:100%;
  position:relative
}
/* ---- header ---- */
header{
  text-align:center;
  margin-bottom:20px;
  position:relative;
  padding-top:12px
}
.header-lamp{
  width:72px;
  height:72px;
  margin:0 auto 8px;
  display:block
}
header h1{
  font-family:'Patrick Hand','ZCOOL KuaiLe',cursive;
  font-size:2rem;
  color:var(--paper-white);
  letter-spacing:2px;
  text-shadow:0 2px 0 rgba(0,0,0,0.3);
  line-height:1.2
}
header .sub{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1rem;
  color:var(--text-mid);
  margin-top:2px;
  letter-spacing:4px
}
.key-badge{
  display:inline-block;
  margin-top:8px;
  padding:4px 14px;
  border-radius:20px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.85rem;
  cursor:pointer;
  transition:all .2s;
  border:2px dashed var(--text-mid);
  color:var(--text-mid);
  background:transparent
}
.key-badge:hover{border-color:var(--amber);color:var(--amber)}
.key-badge.has-key{border-style:solid;border-color:var(--amber);color:var(--amber);background:var(--amber-glow)}
/* ---- tabs ---- */
.tab-bar{
  display:flex;
  justify-content:center;
  gap:28px;
  margin-bottom:20px;
  position:relative;
  flex-wrap:wrap;
  padding-bottom:10px
}
.tab-btn{
  font-family:'Patrick Hand','ZCOOL KuaiLe',cursive;
  font-size:1.35rem;
  background:none;
  border:none;
  padding:6px 12px;
  cursor:pointer;
  color:rgba(251,247,240,0.4);
  position:relative;
  transition:color .3s;
  outline:none
}
.tab-btn.active{color:var(--paper-white)}
.tab-underline{
  position:absolute;
  bottom:2px;
  height:14px;
  pointer-events:none;
  z-index:1;
  opacity:0.7;
  transition:left .35s cubic-bezier(0.34,1.56,0.64,1)
}
/* ---- sections ---- */
.section{display:none;animation:fadeIn .5s ease}
.section.active{display:block}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(18px) scale(0.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
/* ---- sticky card ---- */
.sticky-card{
  position:relative;
  margin-bottom:24px;
  padding:24px 22px 28px;
  border-radius:2px;
  transform-origin:center;
  will-change:transform;
  transition:transform .3s ease;
  box-shadow:0 4px 20px rgba(0,0,0,0.15)
}
.sticky-card:hover{transform:rotate(0deg)!important}
.sticky-card.yellow{background:var(--sticky-yellow)}
.sticky-card.pink{background:var(--sticky-pink)}
.sticky-card.blue{background:var(--sticky-blue)}
.sticky-card.purple{background:var(--sticky-purple)}
.sticky-card .rough-svg{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:0
}
.sticky-card>*:not(.rough-svg):not(.tape):not(.deco-svg){
  position:relative;z-index:1
}
/* tape */
.tape{
  position:absolute;
  width:56px;
  height:18px;
  z-index:2;
  pointer-events:none;
  opacity:0.55;
  border-radius:1px
}
.tape.tl{top:-8px;left:20px;transform:rotate(-4deg)}
.tape.tr{top:-8px;right:20px;transform:rotate(5deg)}
.tape.bl{bottom:-8px;left:20px;transform:rotate(3deg)}
.tape.br{bottom:-8px;right:20px;transform:rotate(-5deg)}
.tape.y{background:rgba(240,232,216,0.8)}
.tape.p{background:rgba(245,232,232,0.8)}
.tape.b{background:rgba(232,238,245,0.8)}
.tape.v{background:rgba(237,232,245,0.8)}
.tape.w{background:rgba(240,240,240,0.7)}
/* style chips */
.style-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;position:relative;z-index:1}
.chip{font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.85rem;padding:4px 12px;border:2px dashed var(--text-mid);border-radius:20px;background:rgba(251,247,240,0.5);color:var(--text-dark);cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--amber);border-style:solid}
.chip.active{border-color:var(--amber);border-style:solid;background:var(--amber-glow);color:var(--amber);font-weight:700}
/* params row */
.params-row{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;position:relative;z-index:1
}
.param-item{flex:1;min-width:120px}
.param-item label{
  display:block;font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.85rem;
  color:var(--text-mid);margin-bottom:4px
}
.param-item select,.param-item input{
  width:100%;padding:8px 10px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.9rem;
  border:2px dashed var(--text-mid);border-radius:4px;
  background:rgba(251,247,240,0.6);color:var(--text-dark);
  outline:none;transition:border-color .2s;cursor:pointer
}
.param-item select:focus,.param-item input:focus{border-color:var(--amber);border-style:solid}
/* result actions */
.result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.result-actions .action-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:6px 14px;font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.9rem;
  border:2px dashed var(--text-mid);border-radius:4px;
  background:rgba(251,247,240,0.5);color:var(--text-dark);
  cursor:pointer;transition:all .2s
}
.result-actions .action-btn:hover{border-color:var(--amber);border-style:solid}
/* form elements */
.sticky-card label{
  display:block;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1.1rem;
  color:var(--text-dark);
  margin-bottom:8px
}
.sticky-card textarea{
  width:100%;
  padding:14px 16px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1.05rem;
  border:2px solid rgba(0,0,0,0.12);
  border-radius:4px;
  background:rgba(251,247,240,0.7);
  color:var(--text-dark);
  resize:vertical;
  min-height:80px;
  outline:none;
  transition:border-color .2s
}
.sticky-card textarea:focus{border-color:var(--amber)}
.translate-btn{position:absolute;top:8px;right:8px;padding:4px 10px;font-size:.8rem;border:1px solid var(--text-mid);border-radius:12px;background:rgba(251,247,240,0.9);color:var(--text-dark);cursor:pointer;transition:all .2s;z-index:2}
.translate-btn:hover{border-color:var(--amber);color:var(--amber)}
.translate-btn.loading{pointer-events:none;opacity:.6}
/* rough button wrapper */
.btn-wrap{
  display:flex;
  justify-content:center;
  margin-top:16px;
  position:relative;
  min-height:52px;
  align-items:center
}
.rough-btn-svg{
  position:absolute;
  pointer-events:none;
  z-index:1;
  width:auto;
  height:52px
}
.rough-btn{
  position:relative;
  z-index:2;
  appearance:none;
  border:none;
  background:transparent;
  font-family:'Patrick Hand','ZCOOL KuaiLe',cursive;
  font-size:1.25rem;
  color:var(--text-dark);
  padding:10px 40px;
  cursor:pointer;
  outline:none;
  transition:transform .35s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap
}
.rough-btn:hover{transform:scale(1.07) rotate(-1.5deg)}
.rough-btn:active{transform:scale(0.94) rotate(1.5deg)}
.rough-btn:disabled{cursor:not-allowed;opacity:0.45}
.rough-btn:disabled:hover{transform:none}
/* deco-svg near buttons */
.deco-svg{
  position:absolute;
  pointer-events:none;
  z-index:3
}
.deco-svg.star-left{left:-30px;top:50%;transform:translateY(-50%)}
.deco-svg.star-right{right:-30px;top:50%;transform:translateY(-50%)}
.deco-svg.arrow-up{left:20px;top:-20px}
.deco-svg.smiley{display:inline-block;vertical-align:middle;margin-left:6px}
/* result area */
.result-wrap{
  margin-top:20px;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:12px
}
.result-wrap.show{display:flex}
.result-wrap img,.result-wrap video{
  max-width:100%;
  border-radius:3px;
  box-shadow:0 6px 24px rgba(0,0,0,0.18)
}
.result-wrap .result-label{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.9rem;
  color:var(--text-mid);
  text-align:center;
  max-width:100%
}
/* ---- progress bar (video) ---- */
.progress-area{
  margin-top:18px;
  position:relative;
  width:100%;
  display:none
}
.progress-area.show{display:block}
.progress-line-svg{
  width:100%;
  height:40px;
  display:block;
  pointer-events:none
}
.progress-status{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.95rem;
  color:var(--text-mid);
  text-align:center;
  margin-top:4px;
  min-height:1.4em
}
/* ---- gallery ---- */
.gallery-section{
  margin-top:8px
}
.gallery-section .gallery-title{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1.3rem;
  color:var(--text-mid);
  text-align:center;
  margin-bottom:16px;
  letter-spacing:2px;
  position:relative
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  justify-items:center
}
.polaroid{
  background:#FBF7F0;
  padding:10px 10px 42px;
  border-radius:2px;
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
  width:100%;
  max-width:220px;
  position:relative;
  transform-origin:center;
  will-change:transform;
  transition:transform .3s ease;
  cursor:default
}
.polaroid:hover{transform:scale(1.02) rotate(0deg)!important}
.polaroid img,.polaroid video{
  width:100%;
  display:block;
  border-radius:1px
}
.polaroid .caption{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.85rem;
  color:var(--text-dark);
  text-align:center;
  line-height:1.3;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical
}
.polaroid .del-btn{
  position:absolute;
  top:-8px;
  right:-8px;
  width:26px;
  height:26px;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  border:none;
  font-size:1rem;
  cursor:pointer;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  line-height:26px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  z-index:5;
  opacity:0;
  transition:opacity .2s
}
.polaroid:hover .del-btn{opacity:1}
.gallery-empty{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1rem;
  color:rgba(123,120,117,0.5);
  text-align:center;
  padding:32px 0;
  grid-column:1/-1
}
/* ---- api key modal ---- */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px
}
.modal-overlay.show{display:flex}
.modal-bubble{
  position:relative;
  background:var(--sticky-yellow);
  max-width:400px;
  width:100%;
  padding:28px 24px 24px;
  z-index:101;
  animation:modalPop .4s cubic-bezier(0.34,1.56,0.64,1)
}
@keyframes modalPop{
  from{opacity:0;transform:scale(0.88) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-bubble .bubble-arrow{
  position:absolute;
  top:-14px;
  left:50%;
  transform:translateX(-50%);
  width:0;height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-bottom:14px solid var(--sticky-yellow);
  z-index:102
}
.modal-bubble .rough-svg{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  z-index:0
}
.modal-bubble>*:not(.rough-svg):not(.bubble-arrow){
  position:relative;z-index:1
}
.modal-bubble h3{
  font-family:'Patrick Hand','ZCOOL KuaiLe',cursive;
  font-size:1.4rem;
  text-align:center;
  margin-bottom:16px;
  color:var(--text-dark)
}
.modal-bubble p{
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.95rem;
  color:var(--text-mid);
  text-align:center;
  margin-bottom:14px
}
.modal-bubble input{
  width:100%;
  padding:12px 14px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:1rem;
  border:2px solid rgba(0,0,0,0.12);
  border-radius:4px;
  background:rgba(251,247,240,0.7);
  color:var(--text-dark);
  outline:none;
  margin-bottom:14px
}
.modal-bubble input:focus{border-color:var(--amber)}
.modal-bubble .btn-wrap{margin-top:0}
/* ---- footer ---- */
footer{
  text-align:center;
  margin-top:32px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.95rem;
  color:rgba(123,120,117,0.5);
  letter-spacing:2px;
  line-height:1.6
}
footer .deco-wrap{
  display:inline-block;
  position:relative
}
footer .deco-wrap .smiley-svg{
  display:inline-block;
  width:20px;
  height:20px;
  vertical-align:middle;
  margin:0 6px
}
/* ---- toast ---- */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.85);
  color:#fff;
  padding:10px 24px;
  border-radius:20px;
  font-family:'Patrick Hand','Ma Shan Zheng',cursive;
  font-size:.95rem;
  z-index:200;
  opacity:0;
  transition:opacity .4s;
  pointer-events:none;
  white-space:nowrap
}
.toast.show{opacity:1}
/* ---- loading state for images ---- */
.result-wrap img.loading{
  background:#ddd;
  min-height:200px
}
/* ---- responsive ---- */
@media(max-width:480px){
  body{padding:16px 10px 32px}
  header h1{font-size:1.7rem}
  .tab-btn{font-size:1.15rem}
  .tab-bar{gap:18px}
  .sticky-card{padding:18px 16px 22px}
  .sticky-card textarea{font-size:1rem}
  .gallery-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .polaroid{padding:6px 6px 34px}
  .deco-svg.star-left{display:none}
  .deco-svg.star-right{display:none}
}
@media(min-width:768px){
  #app{max-width:700px}
  .gallery-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div id="app">

  <!-- ===== HEADER ===== -->
  <header>
    <svg class="header-lamp" id="lampIcon" viewBox="0 0 80 80" fill="none"></svg>
    <h1>Genie AI 创作平台</h1>
    <div class="sub">AI 图片 & 视频生成工具</div>
    <div class="key-badge" id="keyBadge" title="点击设置 API Key">🔑 未设置 Key</div>
  </header>

  <!-- ===== TABS ===== -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="image">图片生成</button>
    <button class="tab-btn" data-tab="video">视频生成</button>
    <svg class="tab-underline" id="tabUnderline" width="0" height="14" viewBox="0 0 120 14" style="display:none"></svg>
  </nav>

  <!-- ===== IMAGE GENERATION ===== -->
  <section class="section active" id="secImage">
    <div class="sticky-card yellow" id="imgCard">
      <div class="tape tl y"></div>
      <div class="tape tr y"></div>
      <label>
        描述你想要的画面
        <svg class="deco-svg arrow-up" width="24" height="20" viewBox="0 0 24 20" style="position:absolute;left:auto;right:-8px;top:-18px"></svg>
      </label>
      <div style="position:relative">
        <textarea id="imgPrompt" placeholder="例如：一只可爱的橘猫坐在书堆上，周围是飘落的樱花..." rows="3"></textarea>
        <button class="translate-btn" id="translateBtn" title="翻译为英文（出图质量更好）" style="display:none">🌐 译</button>
      </div>
      <div class="style-chips" id="styleChips">
        <button class="chip" data-style="realistic photography, 8k, detailed">📷 写实摄影</button>
        <button class="chip" data-style="anime style, studio ghibli">🎨 动漫风</button>
        <button class="chip" data-style="watercolor painting, soft colors">🖌️ 水彩</button>
        <button class="chip" data-style="oil painting, textured brushstrokes">🖼️ 油画</button>
        <button class="chip" data-style="cyberpunk, neon lights, sci-fi">🌃 赛博朋克</button>
        <button class="chip" data-style="pixel art, 16-bit, retro game">👾 像素风</button>
        <button class="chip" data-style="chinese ink wash painting, shan shui">🏔️ 水墨</button>
        <button class="chip" data-style="pencil sketch, hand-drawn">✏️ 素描</button>
      </div>
      <div class="neg-wrap" style="position:relative;z-index:1;margin-top:8px">
        <button class="neg-toggle" id="negToggle" style="font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.85rem;padding:4px 14px;border:2px dashed var(--text-mid);border-radius:20px;background:transparent;color:var(--text-mid);cursor:pointer">🛑 不想看到什么</button>
        <input type="text" id="negPrompt" placeholder="例如：blurry, low quality, ugly, watermark..." style="display:none;margin-top:6px;padding:8px 12px;font-family:'Patrick Hand','Ma Shan Zheng',cursive;font-size:.9rem;border:2px dashed var(--text-mid);border-radius:4px;background:rgba(245,232,232,0.5);color:var(--text-dark);width:100%">
      </div>
      <div class="params-row">
        <div class="param-item">
          <label>模型</label>
          <select id="imgModel">
            <option value="agnes-image-2.1-flash" selected>2.1 Flash · 文生图</option>
            <option value="agnes-image-2.0-flash">2.0 Flash · 图生图</option>
          </select>
        </div>
        <div class="param-item">
          <label>尺寸</label>
          <select id="imgSize">
            <option value="1024x1024">1024×1024 方形</option>
            <option value="1024x768">1024×768 横版</option>
            <option value="768x1024">768×1024 竖版</option>
            <option value="2048x2048">2048×2048 高清</option>
          </select>
        </div>
        <div class="param-item">
          <label>数量</label>
          <select id="imgCount">
            <option value="1" selected>1 张</option>
            <option value="2">2 张</option>
            <option value="4">4 张</option>
          </select>
        </div>
        <div class="param-item" id="imgRefGroup" style="display:none">
          <label>参考图 URL</label>
          <input type="url" id="imgRefUrl" placeholder="https://...">
        </div>
      </div>
      <div class="btn-wrap" id="imgBtnWrap">
        <svg class="rough-btn-svg" id="imgBtnSvg" height="52"></svg>
        <button class="rough-btn" id="imgGenBtn">生成图片</button>
        <svg class="deco-svg star-right" width="24" height="24" viewBox="0 0 24 24" style="right:-32px"></svg>
      </div>
      <div class="result-wrap" id="imgResult">
        <div id="imgResultContent"></div>
        <div class="result-label" id="imgResultLabel"></div>
        <div class="result-actions" id="imgResultActions" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- ===== VIDEO GENERATION ===== -->
  <section class="section" id="secVideo">
    <div class="sticky-card blue" id="vidCard">
      <div class="tape tl b"></div>
      <div class="tape tr b"></div>
      <label>描述你想要的动态画面</label>
      <textarea id="vidPrompt" placeholder="例如：日落时分的海滩，海浪轻轻拍打沙滩，延时摄影..." rows="3"></textarea>

/* ===================== ROUGH.JS HELPERS ===================== */
function addRoughRect(svgEl, x, y, w, h, opts){
  const rc = rough.svg(svgEl);
  const node = rc.rectangle(x, y, w, h, {
    stroke: opts.stroke||'#888',
    strokeWidth: opts.strokeWidth||3,
    roughness: opts.roughness||2.5,
    fill: opts.fill||'transparent',
    fillStyle: opts.fillStyle||'solid',
    fillWeight: opts.fillWeight||0.6,
    bowing: opts.bowing||2,
    seed: opts.seed||randInt(100,9999)
  });
  svgEl.appendChild(node);
}

function applyRoughBorder(container, opts){
  const existing = container.querySelector('.rough-svg');
  if(existing) existing.remove();

  const w = container.offsetWidth;
  const h = container.offsetHeight;
  if(w<10||h<10) return;

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','rough-svg');
  svg.setAttribute('width',w);
  svg.setAttribute('height',h);
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.style.position='absolute';
  svg.style.top='0';
  svg.style.left='0';
  svg.style.pointerEvents='none';
  svg.style.zIndex='0';

  const pos = opts.padding||2;
  addRoughRect(svg, pos, pos, w-pos*2, h-pos*2, opts);

  if(container.style.position!=='relative'&&container.style.position!=='absolute'){
    container.style.position='relative';
  }
  container.insertBefore(svg, container.firstChild);
}

function drawRoughButton(svgEl, opts){
  const w = parseInt(svgEl.getAttribute('width'))||200;
  const h = parseInt(svgEl.getAttribute('height'))||52;

    stroke: opts.stroke||'var(--text-dark)',
    strokeWidth: opts.strokeWidth||3.2,
    roughness: opts.roughness||3,
    fill: opts.fill||'var(--amber)',
    fillStyle: opts.fillStyle||'solid',
    fillWeight: 0.5,
    bowing: 2.5,
    seed: opts.seed||randInt(1000,9999)
  });
}

/* ===================== DECORATIVE ELEMENTS ===================== */
function drawStar(svgEl, cx, cy, r, opts){
  const rc = rough.svg(svgEl);
  const pts = [];
  for(let i=0;i<10;i++){
    const angle = (i*Math.PI/5) - Math.PI/2;
    const rad = i%2===0 ? r : r*0.4;
    pts.push([cx+Math.cos(angle)*rad, cy+Math.sin(angle)*rad]);
  }
  const d = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')+' Z';
  svgEl.appendChild(rc.path(d, {
    stroke: opts.stroke||'#E8850C', strokeWidth:opts.strokeWidth||2.5,
    roughness: opts.roughness||2.5,
    fill: opts.fill||'rgba(255,215,0,0.3)',
    fillStyle: opts.fillStyle||'solid',
    bowing: opts.bowing||2,
    seed: opts.seed||randInt(100,9999)
  }));
}

function drawArrow(svgEl, opts){
  const rc = rough.svg(svgEl);
  const x1=opts.x1||0, y1=opts.y1||0, x2=opts.x2||20, y2=opts.y2||-10;
  svgEl.appendChild(rc.linearPath([[x1,y1],[x2,y2]], {
    stroke: opts.stroke||'var(--amber)',
    strokeWidth: opts.strokeWidth||2.5, roughness: opts.roughness||2.5,
    bowing: opts.bowing||2, seed: opts.seed||randInt(100,9999)
  }));
  const ang = Math.atan2(y2-y1, x2-x1);
  const hs = 5;
  const h1x = x2 - hs*Math.cos(ang-Math.PI/6);
  const h1y = y2 - hs*Math.sin(ang-Math.PI/6);
  const h2x = x2 - hs*Math.cos(ang+Math.PI/6);
  const h2y = y2 - hs*Math.sin(ang+Math.PI/6);
  svgEl.appendChild(rc.path(`M${x2} ${y2} L${h1x} ${h1y} M${x2} ${y2} L${h2x} ${h2y}`, {
    stroke: opts.stroke||'var(--amber)',
    strokeWidth: opts.strokeWidth||2.5, roughness: opts.roughness||2.5,
    bowing: opts.bowing||2, seed: (opts.seed||100)+1
  }));
}

function drawSmiley(svgEl, opts){
  const rc = rough.svg(svgEl);
  const cx=12, cy=12, r=10, s=opts.stroke||'rgba(123,120,117,0.5)';
  svgEl.appendChild(rc.circle(cx, cy, r*2, {stroke:s, strokeWidth:2.5, roughness:2.5, fill:'transparent', bowing:2, seed:opts.seed||5001}));
  svgEl.appendChild(rc.circle(cx-3.5, cy-2, 1.8, {stroke:s, strokeWidth:2, roughness:2, fill:'transparent', seed:(opts.seed||5001)+1}));
  svgEl.appendChild(rc.circle(cx+3.5, cy-2, 1.8, {stroke:s, strokeWidth:2, roughness:2, fill:'transparent', seed:(opts.seed||5001)+2}));
  svgEl.appendChild(rc.path(`M${cx-4} ${cy+2} Q${cx} ${cy+6} ${cx+4} ${cy+2}`, {stroke:s, strokeWidth:2, roughness:2, fill:'transparent', bowing:2, seed:(opts.seed||5001)+3}));
}

  }));

    stroke:'var(--amber)', strokeWidth:2.5, roughness:2,
    fill:'var(--amber)', fillStyle:'solid', bowing:2, seed:8002
  }));

function updateTabUnderline(tab){
  const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
  if(!activeBtn) return;
  const barRect = document.querySelector('.tab-bar').getBoundingClientRect();
  const btnRect = activeBtn.getBoundingClientRect();
  const labelW = Math.max(activeBtn.offsetWidth-8, 60);
  const left = btnRect.left - barRect.left + (btnRect.width - labelW)/2;

  tabUnderline.setAttribute('width', labelW);
  tabUnderline.setAttribute('viewBox', `0 0 ${labelW} 14`);
  tabUnderline.style.display='block';
  tabUnderline.style.width=labelW+'px';
  tabUnderline.style.left=left+'px';

  const rc = rough.svg(tabUnderline);
  tabUnderline.innerHTML='';
  // highlighter-style swipe
  tabUnderline.appendChild(rc.rectangle(0, 3, labelW, 10, {
    stroke:'var(--amber)', strokeWidth:2.5, roughness:3.5,
    fill:'var(--amber)', fillStyle:'solid', fillWeight:0.4, bowing:3, seed:7001

/* ===================== API CALLS ===================== */
async function apiFetch(path, options={}){
  const headers={...options.headers};
  if(apiKey) headers['Authorization']=`Bearer ${apiKey}`;
  if(!headers['Content-Type'] && options.body) headers['Content-Type']='application/json';
  const res = await fetch(`${API_BASE}${path}`, {...options, headers});
  if(!res.ok){
    let msg='请求失败';
    try{const e=await res.json();msg=e.error?.message||e.message||msg}catch(e){}
    throw new Error(msg);
  }
  return res.json();
}

async function generateImage(prompt, model, size, refUrl, negative){
  const m = model || 'agnes-image-2.1-flash';
  const finalPrompt = negative ? `${prompt}. Avoid: ${negative}` : prompt;
  const body = {model:m, prompt:finalPrompt, n:1, size:size||'1024x1024'};
  if(m==='agnes-image-2.0-flash' && refUrl){
    body.extra_body = {tags:['img2img'], image:[refUrl], response_format:'url'};
  }
  const data = await apiFetch('/images/generations',{method:'POST',body:JSON.stringify(body)});
  return data.data?.[0]?.url || data.url || null;
}

async function generateVideo(prompt, numFrames, frameRate, width, height, imageUrl){
  const body = {
    model:'agnes-video-v2.0', prompt,
    num_frames: numFrames, frame_rate: frameRate,
    width, height
  };
  if(imageUrl) body.image = imageUrl;
  const data = await apiFetch('/videos',{method:'POST',body:JSON.stringify(body)});
  const taskId = data.id || data.task_id;
  if(!taskId) throw new Error('无法获取任务 ID');
  // API returns estimated duration in seconds
  // video duration ≠ processing time. Real processing takes much longer (queue + render).
  // Use a realistic estimate: max(video_duration * 30, 120 seconds)
  const vidSecs = parseFloat(data.seconds) || (numFrames / frameRate);
  const estSeconds = Math.max(vidSecs * 40, 600);
  return {taskId, estSeconds, vidSecs};
}

async function pollVideoStatus(taskId){
  return apiFetch(`/videos/${taskId}`);
}

/* ===================== PENDING TASK QUEUE ===================== */
function getQueue(){
  try{return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]')}catch(e){return[]}
}
function saveQueue(q){
  // clean expired (>1 hour)
  q = q.filter(t=>Date.now()-t.startTime<60*60*1000);
  try{localStorage.setItem(PENDING_KEY,JSON.stringify(q))}catch(e){}
}
function addToQueue(task){const q=getQueue();q.push(task);saveQueue(q);}
function updateQueueItem(taskId, updates){
  const q=getQueue();const i=q.findIndex(t=>t.taskId===taskId);
  if(i>=0){Object.assign(q[i],updates);saveQueue(q);}
}
function removeFromQueue(taskId){const q=getQueue().filter(t=>t.taskId!==taskId);saveQueue(q);}

function renderQueue(){
  const q = getQueue();
  const el = document.getElementById('queueList');
  const wrap = document.getElementById('queueWrap');
  if(!el||!wrap) return;
  if(!q.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  el.innerHTML = q.map(t=>{
    const elapsed = Math.ceil((Date.now()-t.startTime)/1000);
    let statusHTML, pct;
    if(t.status==='completed'){statusHTML='<span style="color:var(--green)">✅ 完成</span>';pct=100}
    else if(t.status==='failed'){statusHTML='<span style="color:var(--red)">❌ 失败</span>';pct=0}
    else if(t.status==='in_progress'){statusHTML='<span style="color:var(--amber)">🎬 生成中</span>';pct=Math.min(88,Math.max(5,elapsed/(t.estMs/1000)*100))}
    else {statusHTML='<span style="color:var(--text-mid)">⏳ 排队</span>';pct=Math.min(10,elapsed/60)}

    return `<div class="queue-item" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(251,247,240,0.3);border-radius:6px;margin-bottom:6px;font-size:.85rem">
      <span style="min-width:50px">${statusHTML}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-dark)">${escapeHtml((t.prompt||'').slice(0,40))}</span>
      <span style="color:var(--text-mid);min-width:50px;text-align:right">${elapsed}s</span>
      <div style="width:60px;height:4px;background:#ddd;border-radius:2px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:var(--amber);border-radius:2px"></div>
      </div>
      ${t.status==='completed'||t.status==='failed'?`<button onclick="removeFromQueue('${t.taskId}');renderQueue()" style="border:none;background:none;cursor:pointer;color:var(--text-mid);font-size:1.2rem">&times;</button>`:''}
    </div>`;
  }).join('');
}

// Start polling all queued/in_progress tasks
let queuePollers = {};
function startQueuePolling(){
  const q = getQueue().filter(t=>t.status==='queued'||t.status==='in_progress');
  q.forEach(t=>{
    if(queuePollers[t.taskId]) return; // already polling
    queuePollers[t.taskId] = true;
    pollQueueTask(t);
  });
}

async function pollQueueTask(t){
  const taskId = t.taskId;
  while(true){
    await new Promise(r=>setTimeout(r,8000));
    const q = getQueue();
    const item = q.find(x=>x.taskId===taskId);
    if(!item||item.status==='completed'||item.status==='failed'){delete queuePollers[taskId];renderQueue();return;}
    try{
      const st = await pollVideoStatus(taskId);
      const status = (st.status||'').toLowerCase();
      if(status==='completed'){
        const url = st.remixed_from_video_id||st.video_url||st.url;
        if(url){
          updateQueueItem(taskId,{status:'completed',resultUrl:url});
          addToGallery({type:'video',url,prompt:t.prompt,date:new Date().toLocaleString()});
          showToast('🎉 视频生成完成：'+t.prompt.slice(0,20)+'...');
        }
        delete queuePollers[taskId];renderQueue();return;
      }else if(status==='failed'){
        updateQueueItem(taskId,{status:'failed',error:st.error||'未知错误'});
        delete queuePollers[taskId];renderQueue();return;
      }else if(status==='in_progress'){
        updateQueueItem(taskId,{status:'in_progress'});
      }
      renderQueue();
    }catch(e){/* retry next poll */}
  }
}


async function pollLoop(taskId, prompt, estMs, startTime){
  // estMs is total estimated wait (queue + render). Queue usually dominates.
  // We keep the bar very low during queue, then ramp up once in_progress.
  const maxAttempts = Math.max(40, Math.ceil(estMs/1000 * 4));
  let attempts = 0, done = false, resultUrl = null, inProgress = false;

  while(!done && attempts < maxAttempts){
    await new Promise(r=>setTimeout(r, 5000));
    attempts++;
    const elapsed = Date.now() - startTime;
    const st = await pollVideoStatus(taskId);
    const status = (st.status||'').toLowerCase();

    let p;
    if(status==='in_progress'){
      if(!inProgress){ inProgress=true; }
      if(st.progress > 0){ p = st.progress / 100; }
      else { p = Math.min(0.88, 0.15 + elapsed / (estMs * 1.2)); }
      drawProgress(p);
      const remain = Math.max(0, Math.ceil((estMs - elapsed) / 1000));
      progressStatus.textContent = '🎬 生成中... 预计剩余 ' + remain + ' 秒';
    } else if(status==='queued'){
      // Keep bar low during queue, slowly creeping up
      p = Math.min(0.12, 0.02 + attempts * 0.003);
      drawProgress(p);
      const waited = Math.ceil(elapsed / 1000);
      progressStatus.textContent = '⏳ 排队中... 已等待 ' + waited + ' 秒';
    } else {
      p = Math.min(0.92, elapsed / (estMs * 1.5));
      drawProgress(p);
    }

    if(status==='completed'){
      resultUrl = st.remixed_from_video_id || st.video_url || st.url;
      done = true; break;
    } else if(status==='failed'){
      throw new Error(st.error||'视频生成失败');
    }
  }
  if(!done) throw new Error('生成超时，请稍后重试');
  if(!resultUrl) throw new Error('没有返回视频');

  const vid = document.createElement('video');
  vid.src=resultUrl; vid.controls=true; vid.muted=true; vid.playsInline=true; vid.preload='metadata';
  vidResultContent.appendChild(vid);
  vidResultLabel.textContent='"'+prompt.slice(0,200)+(prompt.length>200?'...':'')+'"';
  vidResultActions.innerHTML = buildResultActions(resultUrl, 'video');
  vidResultActions.style.display = 'flex';
  vidResult.classList.add('show');
  addToGallery({type:'video',url:resultUrl,prompt});
  showToast('🎉 视频生成成功!');
  drawProgress(1);
  progressStatus.textContent='完成!';
  clearPendingTask();
  isGenerating = false;
  vidGenBtn.disabled = false;
  vidGenBtn.textContent = '生成视频';
}

/* ===================== HANDLE GENERATION ===================== */
function buildResultActions(url, type){
  return `
    <button class="action-btn" onclick="downloadMedia('${url.replace(/'/g,"\\'")}','${type}')">⬇ 下载</button>
    <button class="action-btn" onclick="navigator.clipboard.writeText('${url.replace(/'/g,"\\'")}').then(()=>showToast('链接已复制'))">📋 复制链接</button>
  `;
}

function buildResultActionsWithRegen(urls, type, prompt, model, size, refUrl){
  const btns = urls.map(u=>`
    <button class="action-btn" onclick="downloadMedia('${u.replace(/'/g,"\\'")}','${type}')">⬇ 下载</button>
    <button class="action-btn" onclick="navigator.clipboard.writeText('${u.replace(/'/g,"\\'")}').then(()=>showToast('链接已复制'))">📋 复制链接</button>
  `).join('');
  const regenBtn = `<button class="action-btn" onclick="regenerateImage('${prompt.replace(/'/g,"\\'")}','${model}','${size}','${(refUrl||'').replace(/'/g,"\\'")}')" style="border-color:var(--amber);border-style:solid">🔄 重新生成</button>`;
  return btns + regenBtn;
}

let lastImageParams = null;
async function regenerateImage(prompt, model, size, refUrl){
  if(isGenerating) return;
  imgPrompt.value = prompt;
  imgModel.value = model;
  imgSize.value = size;
  if(refUrl) imgRefUrl.value = refUrl;
  await doImageGen(prompt, model, size, parseInt(imgCount.value)||1, refUrl);
}

async function handleImageGen(){
  const prompt = imgPrompt.value.trim();
  if(!prompt){showToast('请输入描述文字');return}
  if(isGenerating) return;

  // Apply style chip if active
  const activeChip = styleChips.querySelector('.chip.active');
  const styleSuffix = activeChip ? ', ' + activeChip.dataset.style : '';
  const fullPrompt = prompt + styleSuffix;

  const model = imgModel.value;
  const size = imgSize.value;
  const count = parseInt(imgCount.value) || 1;
  const refUrl = imgRefUrl.value.trim();

  await doImageGen(fullPrompt, model, size, count, refUrl);
}

async function doImageGen(prompt, model, size, count, refUrl){
  const negative = negPrompt.value.trim();
  isGenerating = true;
  imgGenBtn.disabled = true;
  imgGenBtn.textContent = '生成中 ...';
  imgResult.classList.remove('show');
  imgResultContent.innerHTML = '';
  imgResultLabel.textContent = '';
  imgResultActions.style.display = 'none';

  try{
    const urls = [];
    for(let i=0;i<count;i++){
      const url = await generateImage(prompt, model, size, refUrl, negative);
      if(url) urls.push(url);
    }
    if(!urls.length) throw new Error('没有返回图片');

    const meta = {model, size, date:new Date().toLocaleString()};
    imgResultContent.innerHTML = urls.map(u=>
      `<img src="${escapeHtml(u)}" alt="" style="max-width:100%;border-radius:3px;margin-bottom:8px">`
    ).join('');
    imgResultLabel.textContent = '"'+prompt.slice(0,200)+(prompt.length>200?'...':'')+'"';
    imgResultActions.innerHTML = buildResultActionsWithRegen(urls, 'image', prompt, model, size, refUrl);
    imgResultActions.style.display = 'flex';
    imgResult.classList.add('show');
    urls.forEach(u=>addToGallery({type:'image',url:u,prompt,...meta}));
    lastImageParams = {prompt, model, size, refUrl};
    showToast(urls.length===1?'🎉 图片生成成功!':'🎉 '+urls.length+' 张图片生成成功!');
  }catch(e){
    showToast('生成失败: '+e.message);
  }finally{
    isGenerating=false;
    imgGenBtn.disabled=false;
    imgGenBtn.textContent='生成图片';
    requestAnimationFrame(()=>applyRoughBorder(imgCard,{stroke:'#8B8680',strokeWidth:3,roughness:2.8,fill:'#F0E8D8',fillStyle:'solid',seed:1001}));
  }
}


async function handleVideoGen(){
  const prompt = vidPrompt.value.trim();
  if(!prompt){showToast('请输入描述文字');return}
  if(isGenerating) return;
  isGenerating=true;

  vidGenBtn.disabled=true;
  vidGenBtn.textContent='生成中 ...';
  vidResult.classList.remove('show');
  vidResultContent.innerHTML='';
  vidResultLabel.textContent='';
  vidResultActions.style.display='none';
  progressArea.classList.add('show');
  progressStatus.textContent='正在提交任务 ...';
  drawProgress(0.05);

  try{
    const numFrames = parseInt(vidDuration.value);
    const frameRate = parseInt(vidFps.value);
    const [w, h] = vidSize.value.split('x').map(Number);
    const imageUrl = vidImageUrl.value.trim();
    const {taskId, estSeconds, vidSecs} = await generateVideo(prompt, numFrames, frameRate, w, h, imageUrl);
    const estMs = estSeconds * 1000;
    const startTime = Date.now();

    // Add to queue (persists across refreshes, supports multiple concurrent tasks)
    addToQueue({taskId, prompt, estMs, startTime, vidSecs, status:'queued'});
    startQueuePolling();
    renderQueue();

    progressStatus.textContent = '⏳ 已加入队列（' + Math.round(vidSecs) + 's 视频，预计排队 ' + Math.ceil(estSeconds/60) + ' 分钟）';
    drawProgress(0.03);

    // Switch to queue view
    document.getElementById('queueWrap').scrollIntoView({behavior:'smooth',block:'center'});

  }catch(e){
    showToast('生成失败: '+e.message);
    progressStatus.textContent='出错了，请重试';
  }finally{
    isGenerating=false;
    vidGenBtn.disabled=false;
    vidGenBtn.textContent='生成视频';
    requestAnimationFrame(()=>applyRoughBorder(vidCard,{stroke:'#8B8680',strokeWidth:3,roughness:2.8,fill:'#E8EEF5',fillStyle:'solid',seed:1002}));
  }

}

/* ===================== CARD ROTATIONS ===================== */
function applyCardRotations(){
  document.querySelectorAll('.sticky-card').forEach((card,i)=>{
    const r = CARD_ROTATIONS[i % CARD_ROTATIONS.length] + rand(-0.3,0.3);
    card.style.transform = `rotate(${r}deg)`;
  });
}

/* ===================== DECORATIVE ELEMENTS ===================== */
function drawPageDecorations(){
  document.querySelectorAll('.btn-wrap .deco-svg.star-right').forEach(svg=>{
    if(!svg) return;
    svg.innerHTML='';
    drawStar(svg, 12, 12, 10, {stroke:'#E8850C', strokeWidth:2.5, roughness:2.5, fill:'rgba(232,133,12,0.25)', fillStyle:'solid', seed:9001});
  });

  const arrowSvg = document.querySelector('.sticky-card label .deco-svg');
  if(arrowSvg){
    arrowSvg.innerHTML='';
    drawArrow(arrowSvg, {x1:20,y1:18,x2:4,y2:2, stroke:'var(--amber)', strokeWidth:2.5, seed:9002});
  }

  if(galleryDeco){
    galleryDeco.innerHTML='';
    const rc = rough.svg(galleryDeco);
    galleryDeco.appendChild(rc.rectangle(1,1,16,16,{stroke:'rgba(123,120,117,0.35)', strokeWidth:2, roughness:2.5, fill:'transparent', seed:9003}));
    galleryDeco.appendChild(rc.path('M3 14 L7 7 L11 11 L15 5',{stroke:'rgba(123,120,117,0.25)', strokeWidth:1.5, roughness:2, fill:'transparent', seed:9004}));
  }
}

/* ===================== INITIALIZE ALL ===================== */
function redrawAll(){
  applyRoughBorder(imgCard,{stroke:'#8B8680',strokeWidth:3,roughness:2.8,fill:'#F0E8D8',fillStyle:'solid',seed:1001});
  applyRoughBorder(vidCard,{stroke:'#8B8680',strokeWidth:3,roughness:2.8,fill:'#E8EEF5',fillStyle:'solid',seed:1002});
  drawRoughButton(imgBtnSvg,{seed:3001,fill:'var(--amber)'});
  drawRoughButton(vidBtnSvg,{seed:3002,fill:'var(--amber)'});
  drawRoughButton(apiBtnSvg,{seed:3003,fill:'var(--amber)'});
  drawLamp();
  updateTabUnderline(currentTab);
  applyCardRotations();
  drawPageDecorations();
  if(footerSmiley){footerSmiley.innerHTML='';drawSmiley(footerSmiley,{seed:8008})}
}

/* ===================== EVENT LISTENERS ===================== */
document.addEventListener('DOMContentLoaded',()=>{
  tabBtns.forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.tab)));
  imgGenBtn.addEventListener('click',handleImageGen);
  vidGenBtn.addEventListener('click',handleVideoGen);
  apiSaveBtn.addEventListener('click',saveApiKey);
  apiKeyInput.addEventListener('keydown',e=>{if(e.key==='Enter')saveApiKey()});
  imgPrompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleImageGen()}});
  vidPrompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleVideoGen()}});
  keyBadge.addEventListener('click',showApiModal);
  apiModal.addEventListener('click',e=>{if(e.target===apiModal) apiModal.classList.remove('show')});
  imgModel.addEventListener('change',()=>{
    imgRefGroup.style.display = imgModel.value==='agnes-image-2.0-flash' ? 'block' : 'none';
  });

  // Style chip toggle
  styleChips.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      chip.classList.toggle('active');
      styleChips.querySelectorAll('.chip').forEach(c=>{if(c!==chip)c.classList.remove('active')});
    });
  });

  // Show translate button when Chinese chars detected
  imgPrompt.addEventListener('input',()=>{
    const hasChinese = /[一-鿿]/.test(imgPrompt.value);
    translateBtn.style.display = hasChinese ? 'block' : 'none';
  });

  // Translate Chinese → English via free MyMemory API
  translateBtn.addEventListener('click',async ()=>{
    const text = imgPrompt.value.trim();
    if(!text) return;
    translateBtn.classList.add('loading');
    translateBtn.textContent = '...';
    try{
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`);
      const data = await res.json();
      if(data.responseData?.translatedText){
        imgPrompt.value = data.responseData.translatedText;
        translateBtn.style.display = 'none';
        showToast('✅ 已翻译为英文');
      }
    }catch(e){showToast('翻译失败，请手动输入英文');}
    translateBtn.classList.remove('loading');
    translateBtn.textContent = '🌐 译';
  });

  // Negative prompt toggle
  negToggle.addEventListener('click',()=>{
    const showing = negPrompt.style.display==='block';
    negPrompt.style.display = showing ? 'none' : 'block';
    negToggle.textContent = showing ? '🛑 不想看到什么' : '🛑 收起来';
    if(!showing) negPrompt.focus();
  });

  updateKeyBadge();
  if(!apiKey) showApiModal();

  requestAnimationFrame(()=>{redrawAll();renderGallery()});

  // Recover pending video task after page refresh
  // Recover pending video queue
  const queue = getQueue().filter(t=>t.status==='queued'||t.status==='in_progress');
  if(queue.length && apiKey){
    renderQueue();
    startQueuePolling();
    if(queue.length===1) showToast('🔄 正在恢复 1 个视频任务...');
    else showToast('🔄 正在恢复 ' + queue.length + ' 个视频任务...');
  } else { renderQueue(); }

  let resizeTimer;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(redrawAll,350)});

  // Cmd/Ctrl+Enter shortcut
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){
      e.preventDefault();
      if(currentTab==='image') handleImageGen();
      else handleVideoGen();
    }
  });
});

})();
